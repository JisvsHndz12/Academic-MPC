<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusiKales Pro - Sistema Académico</title>
    <!-- Iconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="dark-theme"> <!-- Default dark theme for glassmorphism -->

    <!-- Fondo Animado -->
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Contenedor Principal -->
    <main id="app-container">

        <!-- VISTA: LOGIN -->
        <section id="login-view" class="view active">
            <div class="glass-card login-card">
                <div class="logo-area">
                    <i class="fas fa-music"></i>
                    <h1>MusiKales Pro</h1>
                    <p>Academia de Música Profesional</p>
                </div>

                <form id="login-form">
                    <div class="input-group">
                        <label for="username"><i class="fas fa-user"></i> Usuario / Cédula</label>
                        <input type="text" id="username" required placeholder="admin, docente1, estudiante1">
                    </div>

                    <div class="input-group">
                        <label for="password"><i class="fas fa-lock"></i> Contraseña</label>
                        <input type="password" id="password" required placeholder="123">
                    </div>

                    <button type="submit" id="btn-login" class="btn-primary">
                        <span>Ingresar</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>

                    <div id="login-error" class="error-msg hidden"></div>

                    <div class="demo-credentials">
                        <small>Demo: admin/123, docente1/123, estudiante1/123</small>
                    </div>
                </form>
            </div>
        </section>

        <!-- VISTA: DASHBOARD (Contenedor dinámico) -->
        <section id="dashboard-view" class="view hidden">
            <nav class="navbar glass-panel">
                <div class="brand">MusiKales Pro</div>
                <div class="user-info">
                    <span id="user-display-name">Usuario</span>
                    <span id="user-role-badge" class="badge">Role</span>
                    <button id="btn-logout" class="btn-icon"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </nav>

            <div class="dashboard-content" id="dashboard-content">
                <!-- El contenido se inyecta vía JS según el rol -->
            </div>
        </section>

    </main>

    <!-- Scripts Modulares -->
    <script src="js/db.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
